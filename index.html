<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            gray: { 900: '#121212', 800: '#1f1f1f' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans antialiased">
  <div class="max-w-4xl mx-auto p-8">
    <header class="py-12 border-b border-gray-800">
      <h1 class="text-5xl font-bold text-white mb-4">Hi, I'm [Your Name]</h1>
      <p class="text-xl text-gray-400">A developer building sleek, modern web experiences.</p>
    </header>
    
    <main class="py-12">
      <section class="mb-12">
        <h2 class="text-2xl font-semibold mb-6">Featured Projects</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 hover:border-gray-500 transition-colors">
            <h3 class="text-xl font-bold text-white mb-2">Project Alpha</h3>
            <p class="text-gray-400 mb-4">A brief description of what you built and the tech stack you used.</p>
            <a href="#" class="text-blue-400 hover:text-blue-300">View Source &rarr;</a>
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
